# Project group and base package
group = com.github.serverfrog.bitburnerplugin

# Plugin version (SemVer)
version = 0.0.7

# Plugin repository URL (for changelog links)
pluginRepositoryUrl = https://github.com/Serverfrog/Bitburner-Plugin

# Backward compatibility: supports IntelliJ 2024.2+ (Java 21+)
# Target platform is 2026.2.3 (Java 25)

# Opt-out flag for bundling Kotlin standard library.
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache
org.gradle.configuration-cache = true

# Enable Gradle Build Cache
org.gradle.caching = true
